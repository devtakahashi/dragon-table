<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100402"><title>龙桌 · 寻龙</title><link rel="icon" href="dragon-avatar.png"><link rel="stylesheet" href="styles.css"><script defer src="app.js"></script></head><body>
<div class="scene"><div class="lantern left"></div><div class="lantern right"></div>
<header><a class="brand" href="./"><img src="dragon-avatar.png" alt=""><span>龙桌</span></a><a class="rules-link" href="#page=rules">玩法说明</a><button id="wallet" class="wallet" aria-label="连接钱包"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 8V5H5a2 2 0 0 1 0-4h14v4M3 3v16a2 2 0 0 0 2 2h15V8H5a2 2 0 0 1-2-2"/><path d="M20 12h-6v5h6M16 14.5h1"/></svg><span id="wallet-label">连接钱包</span></button></header>
<main><div class="intro"><p class="eyebrow">龙隐五牌 · 一翻见分晓</p><h1>寻龙</h1><div class="ornament">◆</div><p>寻龙遇猫，翻开你的好运。</p></div>
<div class="mode-switch"><button id="solo" aria-pressed="true">单人试玩</button><button id="duel" aria-pressed="false">双人对决</button></div>
<div class="stake-row"><label for="stake">演示下注</label><div class="amount"><input id="stake" type="number" min="0.01" max="1000000" step="0.01" value="5" inputmode="decimal"><span>USDC</span></div></div>
<p id="phase" role="status" aria-live="polite">请选择一张牌</p>
<section class="table" aria-label="五张游戏牌"><div id="cards" class="cards"></div><div id="celebration" aria-hidden="true"></div></section>
<div class="controls"><div class="action-row"><button id="action" class="primary" disabled>确认下注</button><button id="shuffle" class="primary secondary">洗牌</button></div><button id="invite" class="invite" hidden>创建邀请链接</button><p id="result" aria-live="polite">选牌后确认，揭晓你的运气。</p><p class="demo">试玩模式 · 不扣款 · 不产生真实奖金</p></div></main></div>
<footer><a href="#page=privacy">隐私政策</a><a href="#page=terms">服务条款</a><a href="#page=rules">游戏规则</a><a href="#page=responsible">理性游戏 · 18+</a><a href="#page=support">帮助与支持</a><p>© 龙桌 · 寻龙</p></footer>
<dialog id="wallet-dialog"><button class="close" aria-label="关闭">×</button><h2>我的账户</h2><p id="address">连接钱包查看账户</p><button id="connect" class="primary">连接 Phantom 钱包</button><p id="wallet-message" role="status">只连接地址，不请求签名或转账。</p><div class="stats"><div>钱包余额<strong id="balance">尚未连接</strong></div><div>真实累计收益<strong>—</strong></div><div>试玩龙牌<strong id="dragon-wins">0</strong></div><div>试玩猫牌<strong id="cat-wins">0</strong></div><div>试玩空牌<strong id="losses">0</strong></div></div><p>试玩记录仅保存在当前页面，不是资金流水。</p><button id="disconnect" class="invite" hidden>断开连接</button></dialog>
<dialog id="invite-dialog"><button class="close" aria-label="关闭">×</button><h2>好友对决 · 预览</h2><p id="invite-summary"></p><p>此链接仅演示邀请流程，不创建真实赌局，不接受充值。</p><input id="invite-link" readonly aria-label="邀请链接"><button id="copy-invite" class="primary">复制邀请链接</button><button id="accept-invite" class="primary" hidden>接受邀请并连接钱包</button><p id="invite-status" role="status"></p></dialog>
<dialog id="page-dialog"><button class="close" aria-label="关闭">×</button><article id="page-content" class="document"></article></dialog></body></html>
