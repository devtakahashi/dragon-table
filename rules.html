<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>游戏规则 · 龙桌</title><link rel="stylesheet" href="styles.css?v=dragon-headers-5"></head><body><header class="document-header"><a class="brand" href="./"><img src="dragon-avatar.png" alt=""><span>龙桌</span></a><a href="./">返回游戏</a></header><main class="document"><h1>游戏规则</h1><p class="notice">试玩版本说明 · 更新于 2026 年 11 月 13 日</p><h2>单人试玩</h2><p>每轮五张牌中放置一张龙牌、一张猫师傅牌和三张空牌。输入演示金额，点击一张牌，再点击「确认下注」。三秒动画结束后，所选卡牌揭晓。</p><h2>结果</h2><p>选中龙牌时显示金色庆祝效果，猫牌显示猫师傅，空牌显示哭泣表情。龙牌与猫牌各有五分之一的概率。动画不影响结果。</p><h2>演示金额与奖金</h2><p>输入金额仅用于展示，不会扣款。成功时显示本轮演示金额，不代表赢得该金额。真实奖金倍率尚未确定。</p><h2>双人模式</h2><p>双人对决暂未开放。在线匹配、双方选牌、资金结算与争议规则将在上线前公布。</p></main><footer><a href="privacy.html">隐私政策</a><a href="terms.html">服务条款</a><a href="rules.html">游戏规则</a><a href="responsible.html">理性游戏</a><a href="support.html">帮助与支持</a></footer></body></html>
